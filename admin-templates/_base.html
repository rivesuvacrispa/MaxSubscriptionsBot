<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page_title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f5f5f5;
            text-align: left;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }

        .actions {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-left: 15px;
        }

        .delete-button {
            color: white;
            background: #d9534f;
            border: none;
            padding: 6px 10px;
        }
    </style>
    <style>
        .status {
            font-weight: bold;
        }

        .status-active {
            color: green;
        }

        .status-inactive {
            color: #999;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 20px;
        }

        .pagination a,
        .pagination span {
            padding: 8px 12px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #333;
        }

        .pagination a:hover {
            background: #f5f5f5;
        }

        .pagination .active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .pagination .disabled {
            color: #aaa;
            background: #f5f5f5;
        }

        .users-info {
            margin-bottom: 15px;
            color: #666;
        }

        .export-button {
            margin-left: 15px;
            padding: 6px 12px;
            border: 1px solid #333;
            color: #333;
            text-decoration: none;
        }

        .export-button:hover {
            background: #333;
            color: white;
        }
    </style>
    <style>
        .message-field {
            margin-bottom: 20px;
        }

        .message-field label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .message-field textarea {
            width: 100%;
            max-width: 800px;
            min-height: 80px;
            box-sizing: border-box;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }

        .message-hint {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

{% include "header.html" %}

<h1>{{ page_title }}</h1>
{% block content %} {% endblock %}

</body>
</html>
