# ротация docker-логов: без неё json-log растёт бесконечно
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      # Prometheus-метрики бота; наружу отдаёт nginx на :9114 (под nft mon-filter)
      - "127.0.0.1:9115:9114"

  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:${ADMIN_PORT}:8000"

  snapshot:
    build:
      context: .
      dockerfile: snapshot.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis

  broadcaster:
    build:
      context: .
      dockerfile: broadcaster.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data


volumes:
  redis_data: