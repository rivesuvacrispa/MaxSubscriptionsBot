# ротация docker-логов: без неё json-log растёт бесконечно
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      # Prometheus-метрики бота; наружу отдаёт nginx на :9114 (под nft mon-filter)
      - "127.0.0.1:9115:9114"
      # вебхук MAX; снаружи терминирует nginx (admin.your-zloy.online/max-webhook/...)
      - "127.0.0.1:8084:8082"

  # старый бот («Розыгрыш призов»): после снятия теневого бана снова отвечает
  # в своих диалогах. Тот же bot.py, но токен старого бота и свой вебхук-путь;
  # CHECK_BOT_TOKEN пустой — старый бот проверяет подписки сам (он админ каналов).
  oldbot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${CHECK_BOT_TOKEN}
      CHECK_BOT_TOKEN: ""
      WEBHOOK_URL: ${WEBHOOK_URL_OLD:-}
    depends_on:
      - redis
    ports:
      # метрики старого бота (Prometheus-обвязка — отдельно, при необходимости)
      - "127.0.0.1:9116:9114"
      # вебхук старого бота; nginx: admin.your-zloy.online/max-webhook-old/...
      - "127.0.0.1:8085:8082"

  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:${ADMIN_PORT}:8000"

  snapshot:
    build:
      context: .
      dockerfile: snapshot.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis

  broadcaster:
    build:
      context: .
      dockerfile: broadcaster.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data


volumes:
  redis_data: